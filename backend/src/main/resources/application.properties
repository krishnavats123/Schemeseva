spring.application.name=schemeseva

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/schemeseva
spring.data.mongodb.database=schemeseva

# JWT
app.jwt.secret=SchemeSeva2024SecretKeyForJWTTokenGenerationMustBe256BitsLong!
app.jwt.expiration=86400000

# Mail (configure your SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server
server.port=8080

# CORS
app.cors.allowed-origins=http://localhost:3000

# Logging
logging.level.com.schemeseva=DEBUG
